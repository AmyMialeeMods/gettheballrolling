plugins {
    id 'net.fabricmc.fabric-loom' version "+"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:+"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.mod_id + "-" + project.minecraft_version }

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    //noinspection GroovyAssignabilityCheck, GrUnresolvedAccess
    it.options.release.set(getProject().java_version.toInteger())
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}

fabricApi {
    configureDataGeneration {
        modId = project.mod_id
        client = true
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

jar {
    from("LICENSE.md") { rename { "${it}_${project.mod_id}" } }
}
